name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Avoid running duplicate workflows for pushes from the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Supabase types (CI uses live schema)
        # Skip if types are committed; uncomment when running supabase CLI in CI.
        # run: npx supabase gen types typescript --project-id ${{ secrets.SUPABASE_PROJECT_ID }} --schema public > src/integrations/supabase/types.ts
        run: echo "Using committed types.ts"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest --run

      - name: Coverage gate (P1 scope, baseline 2026-09-13)
        # Threshold di vitest.config.ts (lines>=50 dst). Shadow
        # whole-app baseline 15.66% + target ≥70% per area: CHANGELOG [P1 Pilot].
        run: npx vitest run --coverage

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-preview:
    name: Vercel Preview Deploy
    # Only deploy preview for PRs (not direct pushes to main, which auto-deploy via Vercel Git integration).
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.vercel.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for preview
        # Pass staging env so the build points at the staging Supabase project.
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
          VITE_APP_ENV: staging
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: vercel
        run: echo "Preview URL: https://git-${{ github.event.pull_request.head.repo.owner }}-${{ github.event.pull_request.head.ref }}-${{ github.event.pull_request.number }}.vercel.app"
        # The actual deploy is handled by Vercel's GitHub integration; this job
        # mainly gates preview behind CI success.

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Lint SQL (basic check)
        run: |
          echo "Migration files exist:"
          ls -la supabase/migrations/ | head -20
